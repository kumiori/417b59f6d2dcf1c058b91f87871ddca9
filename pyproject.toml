[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hube-game"
version = "0.1.0"
description = "Deterministic terminal trajectory for Hube Stop 01"
requires-python = ">=3.11"
dependencies = [
    "game-gamer[tui] @ git+https://github.com/kumiori/113a4cce0c9191877e82b1a0b6767a70.git@439473d6ee94e59d7c0c29ba16ccbbc915c8fb97",
]

[project.optional-dependencies]
vision = ["numpy>=1.26", "opencv-python-headless>=4.8", "scipy>=1.11", "scikit-image>=0.22"]
test = ["pytest>=8"]
quality = ["ruff==0.9.7"]

[project.scripts]
game = "game.terminal:main"
hube-tag = "hube_tag.cli:main"

[tool.setuptools.packages.find]
include = ["game", "game_gamer_semantics*", "hube_tag*"]

[tool.setuptools.package-data]
game = ["fixtures/*.json", "scenarios/*.json", "locales/*/LC_MESSAGES/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
